name: Arenza iOS — Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/arenza-ios/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/arenza-ios/**'
  workflow_dispatch:   # Manual trigger from GitHub Actions UI

jobs:
  build-and-test:
    name: Build & Test on iOS Simulator
    runs-on: macos-15   # macOS Sequoia — Xcode 16.4, iOS 18 SDK

    defaults:
      run:
        working-directory: packages/arenza-ios

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Xcode Version ─────────────────────────────────────────────────────
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      # ── Cache SPM ─────────────────────────────────────────────────────────
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            packages/arenza-ios/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/arenza-ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      # ── Generate Xcode Project ────────────────────────────────────────────
      - name: Generate Arenza.xcodeproj
        run: |
          xcodegen generate --spec project.yml
          echo "✅ Xcode project generated"
          ls -la

      # ── Resolve SPM Dependencies ──────────────────────────────────────────
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            2>&1 | grep -E "(Resolved|error:|Fetch)" || true

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            2>&1 | xcbeautify --renderer github-actions

      # ── Unit Tests ────────────────────────────────────────────────────────
      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | xcbeautify --renderer github-actions

      # ── Upload Test Results ───────────────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ github.run_number }}
          path: packages/arenza-ios/TestResults.xcresult
          retention-days: 14

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## Arenza iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| XcodeGen | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (iPhone 16 Simulator) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Secure Enclave uses software fallback on CI. Real SE testing requires physical device." >> $GITHUB_STEP_SUMMARY

