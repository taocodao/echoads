name: Arenza iOS — Build, Test & TestFlight

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/arenza-ios/**'
      - '.github/workflows/arenza-ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/arenza-ios/**'
  workflow_dispatch:   # Manual trigger from GitHub Actions UI

# ── Shared env ────────────────────────────────────────────────────────────────
env:
  RUBY_VERSION: '3.2'
  XCODE_VERSION: '16'
  APPLE_TEAM_ID: '5R8WY2Q734'   # Apple Developer Team ID
  ASC_APP_ID: '6777539402'      # App Store Connect Numeric App ID

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test (runs on every push + PR)
  # Uses GitHub's free macOS runner — no Mac needed locally!
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test (iOS Simulator)
    runs-on: macos-15

    defaults:
      run:
        working-directory: packages/arenza-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the default Xcode on the runner (avoids version mismatch)
          XCODE_PATH=$(ls /Applications/ | grep Xcode | sort -r | head -1)
          sudo xcode-select -s "/Applications/$XCODE_PATH"
          xcodebuild -version

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: packages/arenza-ios

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            packages/arenza-ios/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/arenza-ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Arenza.xcodeproj
        run: |
          xcodegen generate --spec project.yml
          echo "✅ Xcode project generated"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            2>&1 | grep -E "(Resolved|error:|warning:|Fetch)" || true

      - name: Boot iPhone 16 Simulator
        run: |
          UDID=$(xcrun simctl list devices | grep 'iPhone 16 (' | grep -v 'Plus\|Pro\|e (' | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            -destination "id=$SIMULATOR_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            2>&1 | xcbeautify --renderer github-actions

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Arenza.xcodeproj \
            -scheme Arenza \
            -destination "id=$SIMULATOR_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | xcbeautify --renderer github-actions

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ github.run_number }}
          path: packages/arenza-ios/TestResults.xcresult
          retention-days: 14

      - name: Build Summary
        if: always()
        run: |
          echo "## 🔨 Arenza iOS Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| XcodeGen | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (iPhone 16 Simulator) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Secure Enclave uses software fallback on CI. Real SE testing requires physical device via TestFlight." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: TestFlight Upload (only on push to main)
  # Requires Apple Developer credentials in GitHub Secrets.
  # See: https://github.com/taocodao/echoads/settings/secrets
  # ─────────────────────────────────────────────────────────────────────────────
  upload-testflight:
    name: 🚀 Upload to TestFlight
    runs-on: macos-15
    needs: build-and-test
    # Only run on main branch push (not PRs), AND only if Apple secrets are configured
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.TESTFLIGHT_ENABLED == 'true'

    defaults:
      run:
        working-directory: packages/arenza-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: packages/arenza-ios

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            packages/arenza-ios/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-release-${{ hashFiles('packages/arenza-ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Arenza.xcodeproj
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Arenza.xcodeproj \
            -scheme Arenza

      - name: Install iOS 18 Device Support
        run: |
          # Download and install iOS 18 device support so gym can archive for physical devices
          # This is needed on macos-15 runners where the device SDK is not pre-installed
          xcrun xcodebuild -downloadPlatform iOS 2>&1 | tail -5 || true
          # Verify available SDKs
          xcodebuild -showsdks 2>/dev/null | grep iphoneos || true

      - name: Write App Store Connect API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p fastlane
          # Use Python to safely serialize the .p8 key (which contains newlines) into valid JSON
          python3 - <<'PYEOF'
          import os, json
          key_content = os.environ["ASC_API_KEY_CONTENT"]
          payload = {
            "key_id":     os.environ["ASC_API_KEY_ID"],
            "issuer_id":  os.environ["ASC_ISSUER_ID"],
            "key":        key_content,
            "in_house":   False
          }
          with open("fastlane/AuthKey.json", "w") as f:
            json.dump(payload, f)
          print("✅ AuthKey.json written successfully")
          PYEOF

      - name: Install Certificates via Fastlane Match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '5R8WY2Q734' }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_IN_HOUSE: false
        run: |
          ENCODED=$(echo -n "$MATCH_GIT_BASIC_AUTH" | base64)
          bundle exec fastlane run match \
            type:appstore \
            readonly:false \
            git_url:"https://github.com/taocodao/ios-certificates.git" \
            git_basic_authorization:"$ENCODED" \
            team_id:"${APPLE_TEAM_ID:-5R8WY2Q734}" \
            api_key_path:"fastlane/AuthKey.json"

      - name: Build & Upload to TestFlight via Fastlane
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '5R8WY2Q734' }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || '6777539402' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta

      - name: Upload .ipa as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arenza-${{ github.run_number }}.ipa
          path: packages/arenza-ios/build/Arenza.ipa
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: AWS Device Farm (only on main, after TestFlight upload)
  # Tests the app on a real iPhone (enables Secure Enclave hardware testing).
  # Requires AWS credentials in GitHub Secrets.
  # ─────────────────────────────────────────────────────────────────────────────
  aws-device-farm:
    name: 📱 AWS Device Farm (Real iPhone Testing)
    runs-on: ubuntu-latest
    needs: upload-testflight
    if: |
      github.ref == 'refs/heads/main' &&
      vars.DEVICE_FARM_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .ipa from previous job
        uses: actions/download-artifact@v4
        with:
          name: Arenza-${{ github.run_number }}.ipa
          path: ./ipa

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Upload IPA to AWS Device Farm
        id: upload_ipa
        run: |
          UPLOAD=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}" \
            --name "Arenza-${{ github.run_number }}.ipa" \
            --type IOS_APP \
            --query 'upload.{arn:arn, url:url}' \
            --output json)

          UPLOAD_ARN=$(echo $UPLOAD | jq -r '.arn')
          UPLOAD_URL=$(echo $UPLOAD | jq -r '.url')

          # Upload the IPA file
          curl -T "./ipa/Arenza.ipa" "$UPLOAD_URL"

          # Wait for upload to process
          sleep 30

          echo "upload_arn=$UPLOAD_ARN" >> $GITHUB_OUTPUT

      - name: Schedule Device Farm Run (iPhone 15, iOS 17)
        id: schedule_run
        run: |
          RUN=$(aws devicefarm schedule-run \
            --project-arn "${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}" \
            --app-arn "${{ steps.upload_ipa.outputs.upload_arn }}" \
            --device-pool-arn "${{ secrets.AWS_DEVICE_FARM_IPHONE_POOL_ARN }}" \
            --name "Arenza-CI-${{ github.run_number }}" \
            --test '{"type":"EXPLORER","test":{"type":"EXPLORER"}}' \
            --query 'run.arn' \
            --output text)
          echo "run_arn=$RUN" >> $GITHUB_OUTPUT
          echo "Device Farm Run: $RUN"

      - name: Device Farm Summary
        run: |
          echo "## 📱 AWS Device Farm Test Scheduled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Device | iPhone 15, iOS 17 |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Explorer (UI crawl) |" >> $GITHUB_STEP_SUMMARY
          echo "| Results | [AWS Console](https://us-west-2.console.aws.amazon.com/devicefarm) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> The Device Farm run tests the Secure Enclave PoD signing on real iPhone hardware." >> $GITHUB_STEP_SUMMARY
