services:
  # ── MOQ Relay ─────────────────────────────────────────────────────────────────
  # Serves media tracks over QUIC/WebTransport (UDP 4443)
  moq-relay:
    image: kixelated/moq-relay:latest
    container_name: clarity-moq-relay
    command: >
      --listen [::]:4443
      --tls-cert /certs/cert.pem
      --tls-key  /certs/key.pem
      --auth-public ""
    ports:
      - "4443:4443/udp"
      - "4443:4443/tcp"
    volumes:
      - /home/ubuntu/project-clarity/certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo '' > /dev/tcp/localhost/4443"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── x402 / PoD Relay API ──────────────────────────────────────────────────────
  # Handles: payment verification, PoD receipt batching, DeliveryOracleV2 submission
  x402-gateway:
    image: node:20-alpine
    container_name: clarity-x402-gateway
    working_dir: /app
    command: ["node", "--loader", "tsx/esm", "src/index.local.ts"]
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_PORT=3001
    volumes:
      - ./:/app:ro
      - /app/node_modules
    depends_on:
      moq-relay:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: clarity-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: clarity-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.echoads.tv
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Caddy (TLS reverse proxy) ─────────────────────────────────────────────────
  # Terminates HTTPS for Grafana and the x402 API.
  # Caddy auto-provisions Let's Encrypt certs.
  caddy:
    image: caddy:2-alpine
    container_name: clarity-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: project-clarity-node
